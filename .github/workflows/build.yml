name: Build Wordle Game

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Odśwież kod z repozytorium
      uses: actions/checkout@v4

    - name: Skonfiguruj środowisko Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Zbuduj paczkę za pomocą Mavena
      run: mvn clean package

    - name: Udostępnij zbudowany plik JAR jako artefakt
      uses: actions/upload-artifact@v4
      with:
        name: Wordle-Gra-JAR
        path: target/*-jar-with-dependencies.jar
