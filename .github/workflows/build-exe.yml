name: Build Wordle Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Fat JAR with Maven
        run: mvn clean package

      - name: Create Windows EXE with jpackage
        run: |
          jpackage ^
            --type exe ^
            --name Wordle ^
            --input target ^
            --main-jar wordyl-1.0-SNAPSHOT.jar ^
            --main-class com.example.wordyl.Launcher ^
            --vendor "Example" ^
            --dest target/installer

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wordle-Windows-EXE
          path: target/installer/*.exe