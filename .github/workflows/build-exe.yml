name: Build Wordle Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: maven

      - name: Build fat JAR
        run: mvn -B clean package

      - name: Prepare jpackage input folder
        run: |
          New-Item -ItemType Directory -Force -Path input
          Copy-Item target/wordyl-1.0-SNAPSHOT.jar input/

      - name: Create Windows EXE with jpackage
        run: >
          jpackage
          --type exe
          --name Wordle
          --input input
          --main-jar wordyl-1.0-SNAPSHOT.jar
          --main-class com.example.wordyl.Launcher
          --add-modules java.base,java.desktop,java.logging,java.xml,jdk.unsupported
          --win-shortcut
          --win-menu
          --dest target/installer

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wordle-Windows-EXE
          path: target/installer/*.exe